<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Games - GameHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Effect -->
  <div class="background-effect"></div>

  <!-- Main Hub Wrapper -->
  <div class="hub-container">

    <header class="hub-header">
    <div class="logo">
        <i class="fa-solid fa-gamepad logo-icon"></i>
        <span>Racing</span> HUB
    </div>
    <p class="tagline">Select a game and start playing!</p>

    <!-- Search Bar with Clear (✖) Button -->
    <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Search or scroll games..." autocomplete="off">
    <span id="clearSearch" class="clear-btn">&times;</span>
    <div id="searchResults" class="search-dropdown"></div>
</div>
</header>

    <!-- Games Grid -->
    <div class="games-grid">
      
      <!-- Game 1: Drift Dudes-->
        <a href="gamedetails2/shimai.html" class="game-card">
          <img src="assets/Shimai.jpg" alt="Shimai">
          <h3>Shimai</h3>
        </a>

        <!-- Game 2: Drift Dudes-->
        <a href="gamedetails2/driftdudes.html" class="game-card">
          <img src="assets/Drift Dudes.jpg" alt="Drift Dudes">
          <h3>Drift Dudes</h3>
        </a>

    </div>

    <!-- Footer -->
    <footer>
      <p>© 2026 Game Hub Studio. All Rights Reserved. owner name Gaurav.</p>
    </footer>

  </div>

<!-- Top Right Menu Button -->
<div class="menu-container" style="position: fixed; top: 20px; right: 25px; z-index: 999;">
    <button class="menu-btn" id="menuBtn" style="cursor: pointer; font-size: 18px; background: #0f3460; color: white; padding: 10px 18px; border: none; border-radius: 8px;">☰ Menu</button>
</div>

<!-- Premium Profile & Settings Sidebar -->
<div class="sidebar" id="sidebar">
  <button class="close-btn" id="closeBtn">&times;</button>
  <h2>My Profile & Settings</h2>

  <div class="profile-form">
    <!-- Avatar Selection Section -->
     <header class="hub-header">
    <a href="index.html" class="back-btn">← Back to Main Hub</a>
    <h1 class="logo">RACING <span>GAMES</span> </h1>
    <p class="tagline">Speed up and dominate the track!</p>
</header>

<div class="sidebar-links">
    <a href="index.html">🏠 Home</a><br>
    <a href="racing.html">🏎️ Racing Games</a><br>
    <a href="girls.html">🎀 Girls Games</a><br>
    <a href="multiplayer.html">👥 Multiplayer</a><br>
    <a href="localgame.html">🕹️ Local Games</a><br>
</div>
    
    <!-- Toast Notification Message -->
    <div id="toast" class="toast"></div>
  </div>
</div>
  <!-- JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
