<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shimai - Details</title>
    <!-- Same Details CSS -->
    <link rel="stylesheet" href="gamedetails.css">
</head>
<body class="detail-body">

    <!-- Header Navigation -->
    <header class="detail-header">
        <a href="../index.html" class="back-btn">❮ Back to Hub</a>
        <span style="color: #00f2fe; font-weight: bold;">GAME HUB</span>
    </header>

    <!-- Game Detail Card -->
    <main class="detail-card">
        
        <!-- Shimai Wallpaper Banner -->
        <div class="banner-wrapper">
            <img src="../assets/shimai.jpg" alt="Shimai">
        </div>

        <!-- PLAY NOW Button (Points to Shimai game folder) -->
        <a href="https://cdn.htmlgames.com/Shimai/" class="play-now-btn">▷ PLAY NOW</a>

        <!-- Title & Rating -->
        <div class="game-info">
            <h1>Shimai</h1>
            <div class="rating-stars">⭐⭐⭐⭐⭐</div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn" id="share-btn">🔗 Share</button>
            <button class="action-btn" id="like-btn">👍 0</button>
        </div>

        <!-- About Description -->
        <div class="about-box">
            <h3>About Game</h3>
            <p>Shimai is a traditional Japanese tile-based game played with 144 tiles. The goal is to remove all tiles from the board by matching them in pairs.</p>
        </div>

    </main>

    <!-- Same Details JS -->
    <script src="gamedetails.js"></script>
</body>
</html>
