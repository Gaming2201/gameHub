<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defly.io - Details</title>
    <!-- Same Details CSS -->
    <link rel="stylesheet" href="gamedetails.css">
</head>
<body class="detail-body">

    <!-- Header Navigation -->
    <header class="detail-header">
        <a href="../multiplayer.html" class="back-btn">❮ Back to Hub</a>
        <span style="color: #00f2fe; font-weight: bold;">GAME HUB</span>
    </header>

    <!-- Game Detail Card -->
    <main class="detail-card">
        
        <!-- Drift Dudes Wallpaper Banner -->
        <div class="banner-wrapper">
            <img src="../assets/Defly.io.jpg" alt="Drift Dudes">
        </div>

        <!-- PLAY NOW Button (Points to Drift Dudes game folder) -->
        <a href="https://play.famobi.com/defly" class="play-now-btn">▷ PLAY NOW</a>

        <!-- Title & Rating -->
        <div class="game-info">
            <h1>Defly.io</h1>
            <div class="rating-stars">⭐⭐⭐⭐⭐</div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn" id="share-btn">🔗 Share</button>
            <button class="action-btn" id="like-btn">👍 0</button>
        </div>

        <!-- About Description -->
        <div class="about-box">
            <h3>About Game</h3>
            <p>Defly.io is an online multiplayer game where you fly a helicopter to capture territory by building connected walls while shooting down rival players and upgrading your stats to top the leaderboard.</p>
        </div>

    </main>

    <!-- Same Details JS -->
    <script src="gamedetails.js"></script>
</body>
</html>
